<!DOCTYPE html>
<html lang="en">
<head>

    <title>Under Maintenance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;

            margin: 0;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #d9534f;
            font-size: 2em;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
        }
        .contact-info {
            margin-top: 20px;
            font-weight: bold;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Page Under Maintenance</h1>
        <p>This page is currently undergoing maintenance. We apologize for the inconvenience and appreciate your patience.</p>

        <div class="contact-info">
            <p>If you have any urgent queries, please contact us at:</p>
            <p><a href="mailto:teameternalpeace@gmail.com">teameternalpeace@gmail.com</a></p>
